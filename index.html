<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Sunflower 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <!-- Luz ambiental -->
        <div class="ambient-light"></div>

        <!-- Estrellas / partículas -->
        <div class="particles"></div>

        <!-- Destellos -->
        <div class="sparkles"></div>

        <!-- Girasol -->
        <div class="sunflower">

            <div class="sunflower-glow"></div>

            <img
                src="sunflower.jpg"
                alt="Girasol luminoso"
                class="sunflower-image"
            >

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
